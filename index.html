<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Al-Fahd TV — أفلام ومسلسلات في مكان واحد">
  <title>Al-Fahd TV | أفلام ومسلسلات</title>
  <style>
    :root{--bg:#08090d;--panel:#111319;--panel2:#191c24;--text:#f7f7f8;--muted:#999da9;--red:#ef233c;--red2:#b70924;--line:rgba(255,255,255,.09);--shadow:0 20px 50px rgba(0,0,0,.4)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input{font:inherit}button{color:inherit}.hidden{display:none!important}
    .ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 80% 0,rgba(239,35,60,.14),transparent 30%),radial-gradient(circle at 0 40%,rgba(112,22,40,.08),transparent 28%)}
    header{position:sticky;top:0;z-index:20;height:72px;padding:0 max(18px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;background:rgba(8,9,13,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:.2px}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--red),var(--red2));display:grid;place-items:center;box-shadow:0 8px 24px rgba(239,35,60,.28)}
    .brand-mark img{width:100%;height:100%;object-fit:cover;border-radius:12px}.desktop-nav{display:flex;align-items:center;gap:5px;padding:5px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px}.desktop-nav button{border:0;background:transparent;padding:9px 15px;border-radius:10px;color:var(--muted);cursor:pointer;font-weight:800}.desktop-nav button.active{background:#fff;color:#101116}.header-actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;cursor:pointer}.icon-btn svg{width:20px}
    main{width:min(1180px,100%);margin:auto;padding:18px 18px 100px}.hero{min-height:430px;border-radius:28px;overflow:hidden;position:relative;display:flex;align-items:flex-end;background:linear-gradient(120deg,#1b1015,#11141b);box-shadow:var(--shadow);isolation:isolate}.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.62;filter:saturate(.9)}.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,9,13,.98) 0,rgba(8,9,13,.72) 42%,rgba(8,9,13,.1) 80%),linear-gradient(0deg,#08090d 0,transparent 58%)}
    .hero-content{position:relative;z-index:2;width:min(600px,90%);padding:42px}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:#ff7c8d;font-size:13px;font-weight:800}.dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}h1{font-size:clamp(30px,6vw,54px);line-height:1.12;margin:12px 0 10px}.hero p{color:#c4c6ce;line-height:1.8;margin:0 0 22px;max-width:520px}.cta-row{display:flex;flex-wrap:wrap;gap:10px}.btn{border:0;border-radius:13px;padding:12px 19px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;font-weight:800}.btn svg{width:18px}.btn-primary{background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 10px 25px rgba(239,35,60,.25)}.btn-ghost{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(10px)}
    .toolbar{margin:28px 0 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.search{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:0 14px}.search svg{width:20px;color:var(--muted)}.search input{height:50px;flex:1;border:0;outline:0;background:transparent;color:white;min-width:0}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:700;color:#c4c6ce}.chip.active{background:white;color:#111;border-color:white}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin:28px 0 15px}.section-head h2{margin:0;font-size:23px}.section-head span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px 14px}.card{cursor:pointer;min-width:0;transition:.22s}.poster{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,#20232d,#111319);border:1px solid var(--line)}.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:.35s}.card:hover{transform:translateY(-5px)}.card:hover img{transform:scale(1.04)}.badge{position:absolute;right:8px;top:8px;padding:5px 8px;border-radius:8px;background:rgba(8,9,13,.76);backdrop-filter:blur(8px);font-size:10px;font-weight:900;border:1px solid rgba(255,255,255,.12)}.play-float{position:absolute;left:50%;top:50%;transform:translate(-50%,-40%);width:44px;height:44px;border:0;border-radius:50%;background:rgba(239,35,60,.92);opacity:0;display:grid;place-items:center;transition:.2s}.card:hover .play-float{opacity:1;transform:translate(-50%,-50%)}.play-float svg{width:18px}.card-title{font-weight:800;font-size:14px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-meta{color:var(--muted);font-size:12px;margin-top:5px}
    .state{min-height:280px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px}.spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--red);animation:spin .8s linear infinite;margin:0 auto 14px}@keyframes spin{to{transform:rotate(360deg)}}.skeleton{pointer-events:none}.skeleton .poster,.skeleton .line{background:linear-gradient(100deg,#171921 20%,#22252f 40%,#171921 60%);background-size:200% 100%;animation:shine 1.3s infinite}.skeleton .line{height:13px;border-radius:7px;margin-top:10px;width:88%}.skeleton .line.short{width:50%;height:10px}@keyframes shine{to{background-position:-200% 0}}
    .notice{display:none;margin:15px 0;padding:13px 15px;border:1px solid rgba(239,35,60,.32);background:rgba(239,35,60,.08);border-radius:13px;color:#ffc4cc}.notice.show{display:flex;justify-content:space-between;align-items:center;gap:12px}.notice button{border:0;background:var(--red);padding:7px 12px;border-radius:9px;cursor:pointer}
    .modal{position:fixed;inset:0;z-index:60;background:var(--bg);padding:0;display:none;align-items:stretch;justify-content:stretch}.modal.open{display:flex}.sheet{width:100%;max-height:100vh;overflow:auto;background:#101218;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.sheet-top{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;padding:12px;background:linear-gradient(#101218,transparent)}.close{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#191c24;cursor:pointer}.detail{padding:0 24px 26px}.detail h2{font-size:26px;margin:8px 0}.detail-meta{color:var(--muted);margin-bottom:16px}.player{aspect-ratio:16/9;background:#030303;border-radius:17px;overflow:hidden;margin:8px 0 16px}.player video,.player iframe{width:100%;height:100%;border:0;background:#000}.detail-actions{display:flex;gap:10px;flex-wrap:wrap}.episodes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.episode{border:1px solid var(--line);background:var(--panel2);padding:11px;border-radius:11px;cursor:pointer}.episode.active{background:var(--red);border-color:var(--red)}
    .mobile-nav{display:none;position:fixed;z-index:30;bottom:0;right:0;left:0;padding:8px 18px calc(8px + env(safe-area-inset-bottom));background:rgba(10,11,15,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);justify-content:space-around}.nav-item{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;gap:4px;font-size:11px}.nav-item svg{width:21px}.nav-item.active{color:white}
    footer{color:#777b87;text-align:center;padding:30px 10px 10px;font-size:12px}
    @media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}.hero{min-height:390px}}
    @media(max-width:620px){header{height:62px}.brand{font-size:17px}.brand-mark{width:34px;height:34px}.desktop-nav{display:none}main{padding:12px 12px 92px}.hero{min-height:365px;border-radius:21px;align-items:flex-end}.hero-content{padding:24px 20px;width:100%}.hero:after{background:linear-gradient(0deg,#08090d 3%,rgba(8,9,13,.25) 85%),linear-gradient(90deg,rgba(8,9,13,.65),transparent)}.hero p{font-size:13px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.toolbar{margin-top:18px}.chips{width:100%}.grid{grid-template-columns:repeat(3,1fr);gap:15px 9px}.poster{border-radius:12px}.card-title{font-size:12px}.card-meta{font-size:10px}.play-float{display:none}.section-head h2{font-size:19px}.mobile-nav{display:flex}.modal{padding:0;align-items:flex-end}.sheet{max-height:94vh;border-radius:24px 24px 0 0}.detail{padding:0 14px 22px}.episodes{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:360px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="ambient"></div>
<header>
  <div class="brand"><span class="brand-mark"><img src="assets/fahd-logo.jpg" alt="Al-Fahd TV"></span><span>Al-Fahd TV</span></div>
  <nav class="desktop-nav" aria-label="التنقل الرئيسي"><button data-route="home" onclick="go('home')">الرئيسية</button><button data-route="movies" onclick="go('movies')">الأفلام</button><button data-route="series" onclick="go('series')">المسلسلات</button></nav>
  <div class="header-actions"><button class="icon-btn" aria-label="صفحة البحث" onclick="go('search')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></div>
</header>
<main>
  <section class="hero" id="hero">
    <img class="hero-bg" id="heroImage" alt="" hidden>
    <div class="hero-content"><span class="eyebrow"><i class="dot"></i> مختارات Al-Fahd TV</span><h1 id="heroTitle">سينما تستاهل وقتك</h1><p id="heroText">أحدث الأفلام والمسلسلات في تجربة سريعة ومصممة لكل الشاشات.</p><div class="cta-row"><button class="btn btn-primary" id="heroPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>شاهد الآن</button><button class="btn btn-ghost" onclick="document.querySelector('#catalog').scrollIntoView()">تصفح المحتوى</button></div></div>
  </section>
  <section class="toolbar" id="catalog"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" type="search" inputmode="search" autocomplete="off" placeholder="ابحث عن فيلم أو مسلسل..."></label><div class="chips"><button class="chip active" data-filter="movies">أحدث الأفلام</button><button class="chip" data-filter="series">المسلسلات</button><button class="chip" data-filter="arabic">عربي</button><button class="chip" data-filter="foreign">أجنبي</button></div></section>
  <div class="notice" id="notice"><span id="noticeText">تعذر تحميل المحتوى.</span><button onclick="loadCatalog(activeFilter)">إعادة المحاولة</button></div>
  <div class="section-head"><div><h2 id="sectionTitle">أحدث الأفلام</h2><span id="resultCount">يتم تجهيز المكتبة...</span></div></div>
  <div class="grid" id="mediaGrid"></div>
  <div class="state hidden" id="emptyState"><div><h3>لا توجد نتائج</h3><p>جرّب كلمة بحث أو قسمًا آخر.</p></div></div>
  <footer>© 2026 Al-Fahd TV — جميع الحقوق محفوظة</footer>
</main>
<nav class="mobile-nav"><button class="nav-item" data-route="home" onclick="go('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v9H3z"/></svg>الرئيسية</button><button class="nav-item" data-route="movies" onclick="go('movies')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>الأفلام</button><button class="nav-item" data-route="series" onclick="go('series')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4zM8 2v3m8-3v3"/></svg>المسلسلات</button><button class="nav-item" data-route="search" onclick="go('search')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>بحث</button></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet"><div class="sheet-top"><button class="close" onclick="closeModal()" aria-label="إغلاق">✕</button></div><div class="detail" id="detail"></div></div></div>
<script>
const WORKER='https://akwam-stream-fetcher.meroo3292.workers.dev/';
const SOURCES={movies:'https://akwam.it/movies',series:'https://akwam.it/series',arabic:'https://akwam.it/movies?section=29',foreign:'https://akwam.it/movies?section=30'};
const LABELS={movies:'أحدث الأفلام',series:'أحدث المسلسلات',arabic:'أفلام عربية',foreign:'أفلام أجنبية'};
let catalog=[],activeFilter='movies',controller=null,heroItem=null;
let searchTimer=null,currentRoute='home';
let episodeContext={href:'',items:[],page:1,loading:false};
const $=s=>document.querySelector(s); const grid=$('#mediaGrid');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safe(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}}
function api(params){return WORKER+'?'+new URLSearchParams(params)}
async function json(url,timeout=22000){controller?.abort();controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(url,{headers:{Accept:'application/json'},signal:controller.signal,cache:'no-store'});const d=await r.json().catch(()=>null);if(!r.ok||!d||d.status==='error')throw new Error(d?.message||'الخادم غير متاح');return d}finally{clearTimeout(timer)}}
function skeletons(){grid.innerHTML=Array.from({length:12},()=>'<article class="card skeleton"><div class="poster"></div><div class="line"></div><div class="line short"></div></article>').join('')}
async function loadCatalog(filter='movies'){
 activeFilter=filter; $('#notice').classList.remove('show'); $('#emptyState').classList.add('hidden'); $('#sectionTitle').textContent=LABELS[filter]; $('#resultCount').textContent='يتم تحميل المحتوى...'; skeletons();
 document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.filter===filter));
 try{const data=await json(api({action:'genre',genre:SOURCES[filter]}));const raw=Array.isArray(data.data)?data.data:[];const junk=/^(اكوام|إشعارات اكوام|موقع اكوام القديم|web stats)$/i;catalog=raw.filter(x=>safe(x.href)&&!junk.test(String(x.title||'').trim()));render();if(catalog.length){heroItem=catalog[0];setHero(heroItem)}}catch(e){grid.innerHTML='';$('#resultCount').textContent='تعذر الاتصال';$('#noticeText').textContent=e.name==='AbortError'?'الاتصال استغرق وقتًا طويلًا. حاول مرة أخرى.':'تعذر تحميل المحتوى الآن. تحقق من اتصال الووركر.';$('#notice').classList.add('show')}
}
async function runSearch(query){
 const q=String(query||'').trim();activeFilter='search';$('#notice').classList.remove('show');$('#emptyState').classList.add('hidden');$('#sectionTitle').textContent=q?`نتائج البحث عن: ${q}`:'ابحث في مكتبة Al-Fahd TV';
 document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));if(!q){catalog=[];grid.innerHTML='';$('#resultCount').textContent='اكتب اسم الفيلم أو المسلسل';return}skeletons();$('#resultCount').textContent='جاري البحث...';
 try{
  controller?.abort();controller=new AbortController();const timer=setTimeout(()=>controller.abort(),25000);
  const requests=Array.from({length:8},(_,i)=>fetch(api({action:'search',q,p:i+1}),{headers:{Accept:'application/json'},signal:controller.signal,cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok||d.status==='error')throw new Error(d.message||'فشل البحث');return Array.isArray(d.data)?d.data:[]}));
  const pages=await Promise.allSettled(requests);clearTimeout(timer);const raw=pages.flatMap(x=>x.status==='fulfilled'?x.value:[]);if(!raw.length&&pages.every(x=>x.status==='rejected'))throw new Error('تعذر البحث');
  const junk=/^(اكوام|إشعارات اكوام|موقع اكوام القديم|web stats)$/i,seen=new Set();catalog=raw.filter(x=>{const href=safe(x.href);if(!href||junk.test(String(x.title||'').trim())||seen.has(href))return false;seen.add(href);return true});render()
 }catch(e){grid.innerHTML='';$('#resultCount').textContent='تعذر البحث';$('#noticeText').textContent='تعذر تنفيذ البحث الآن. حاول مرة أخرى.';$('#notice').classList.add('show')}
}
function go(route){if(location.hash!==`#/${route}`)location.hash=`#/${route}`;else applyRoute()}
function applyRoute(){
 const route=(location.hash.match(/^#\/(home|movies|series|search)/)||[])[1]||'home';currentRoute=route;
 document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('active',x.dataset.route===route));
 const isHome=route==='home';$('#hero').classList.toggle('hidden',!isHome);$('#catalog').scrollIntoView({block:'start'});if(isHome)window.scrollTo({top:0,behavior:'smooth'});
 if(route==='home'||route==='movies')loadCatalog('movies');else if(route==='series')loadCatalog('series');else{activeFilter='search';catalog=[];grid.innerHTML='';$('#sectionTitle').textContent='ابحث في مكتبة Al-Fahd TV';$('#resultCount').textContent='اكتب اسم الفيلم أو المسلسل';$('#emptyState').classList.add('hidden');document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));setTimeout(()=>$('#search').focus(),80)}
 document.title=`Al-Fahd TV | ${{home:'الرئيسية',movies:'الأفلام',series:'المسلسلات',search:'البحث'}[route]}`;
}
function render(){const q=$('#search').value.trim().toLowerCase();const list=catalog.filter(x=>String(x.title||'').toLowerCase().includes(q));$('#resultCount').textContent=list.length?`${list.length} عمل متاح`:'لا توجد نتائج';$('#emptyState').classList.toggle('hidden',!!list.length);grid.innerHTML=list.map((x,i)=>{const img=safe(x.img);return `<article class="card" data-i="${i}" tabindex="0"><div class="poster">${img?`<img loading="lazy" src="${esc(img)}" alt="${esc(x.title)}" onerror="this.style.display='none'">`:''}<span class="badge">${activeFilter==='series'?'مسلسل':'فيلم'}</span><span class="play-float"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></span></div><div class="card-title">${esc(x.title||'بدون عنوان')}</div><div class="card-meta">شاهد الآن • Al-Fahd TV</div></article>`}).join('');grid.querySelectorAll('.card').forEach((el)=>{const item=list[+el.dataset.i];el.onclick=()=>openItem(item);el.onkeydown=e=>{if(e.key==='Enter')openItem(item)}})}
function setHero(x){$('#heroTitle').textContent=x.title||'أحدث العروض';$('#heroText').textContent='متاح الآن للمشاهدة والتحميل على Al-Fahd TV.';const im=safe(x.img);if(im){$('#heroImage').src=im;$('#heroImage').hidden=false}}
async function openItem(item){const href=safe(item.href);if(!href)return;$('#modal').classList.add('open');document.body.style.overflow='hidden';$('#detail').innerHTML='<div class="state"><div><div class="spinner"></div>جاري تجهيز المشاهدة...</div></div>';history.pushState({watch:true},'', '#watch');try{const data=await json(api({action:'series',series:href}));showDetail(data,item)}catch(e){$('#detail').innerHTML=`<div class="state"><div><h3>لم نتمكن من تجهيز المشاهدة</h3><p>${esc(e.message||'حاول مرة أخرى')}</p><button class="btn btn-primary" onclick="openItem(${JSON.stringify(item).replace(/"/g,'&quot;')})">إعادة المحاولة</button></div></div>`}}
async function playbackUrl(url){const clean=safe(url);if(!clean)return'';try{const host=new URL(clean).hostname.toLowerCase();if(host==='downet.net'||host.endsWith('.downet.net')){const d=await json(api({action:'sign',url:clean}));return safe(d.url)||''}}catch{return''}return clean}
function renderEpisodes(){const eps=episodeContext.items||[];const box=document.querySelector('#episodeBox');if(!box)return;box.innerHTML=eps.length?`<div class="episodes">${eps.map(e=>`<button class="episode" onclick="openEpisode('${esc(e.link).replace(/'/g,'\\&#39;')}')">الحلقة ${esc(e.num)}</button>`).join('')}</div><button id="moreEpisodes" class="btn btn-ghost" style="width:100%;margin-top:12px" onclick="loadMoreEpisodes()">تحميل حلقات إضافية</button>`:'<div class="state">لا توجد حلقات متاحة حاليًا.</div>';}
async function loadMoreEpisodes(){if(episodeContext.loading||!episodeContext.href)return;episodeContext.loading=true;const next=episodeContext.page+1;const btn=document.querySelector('#moreEpisodes');if(btn){btn.disabled=true;btn.textContent='جاري تحميل الحلقات...'}try{const data=await json(api({action:'series',series:episodeContext.href,p:next,page:next}));const incoming=Array.isArray(data.episodes)?data.episodes:(Array.isArray(data.data?.episodes)?data.data.episodes:[]);const seen=new Set(episodeContext.items.map(x=>x.link));let added=0;incoming.forEach(x=>{if(x.link&&!seen.has(x.link)){episodeContext.items.push(x);seen.add(x.link);added++}});episodeContext.page=next;if(added===0||incoming.length<5){const b=document.querySelector('#moreEpisodes');if(b)b.remove()}else renderEpisodes()}catch(e){if(btn){btn.disabled=false;btn.textContent='إعادة تحميل الحلقات'}}finally{episodeContext.loading=false}}
async function showDetail(data,item){const title=data.movie_title||item.title||'بدون عنوان',media=safe(data.media_src),description=String(data.description||''),actors=Array.isArray(data.actors)?data.actors:[],trailer=safe(data.trailer),playable=media&&!data.is_iframe?await playbackUrl(media):media,download=safe(data.download_src)||media,eps=Array.isArray(data.episodes)?data.episodes:[];episodeContext={href:safe(item.href)||'',items:eps.slice(),page:1,loading:false};let player='';if(media&&playable){player=data.is_iframe?`<div class="player"><iframe src="${esc(media)}" allow="autoplay;fullscreen;picture-in-picture" referrerpolicy="no-referrer" allowfullscreen></iframe></div>`:`<div class="player"><video controls playsinline preload="metadata" src="${esc(playable)}"></video></div>`}else{player='<div class="state"><div>اختر حلقة من القائمة لبدء المشاهدة.</div></div>'}$('#detail').innerHTML=`<h2>${esc(title)}</h2><div class="detail-meta">Al-Fahd TV • مشاهدة بجودة عالية</div>${description?`<p class="detail-description">${esc(description)}</p>`:``}${actors.length?`<div class="detail-cast"><b>الممثلون:</b> ${actors.map(esc).join("، ")}</div>`:``}${trailer?`<a class="btn btn-ghost" href="${esc(trailer)}" target="_blank" rel="noopener noreferrer">▶ مشاهدة التريلر</a>`:``}${player}<div class="detail-actions">${media&&playable?'<button class="btn btn-primary" onclick="document.querySelector(\'#detail video\')?.play()">▶ تشغيل</button>':''}${download?`<a class="btn btn-ghost" href="${esc(download)}" target="_blank" rel="noopener noreferrer" download>↓ تحميل</a>`:''}</div>${eps.length?'<div id="episodeBox"></div>':''}`;if(eps.length)renderEpisodes();}
async function openEpisode(link){const item={title:'الحلقة',href:link};await openItem(item)}
function closeModal(fromPop=false){$('#modal').classList.remove('open');document.body.style.overflow='';$('#detail').innerHTML='';if(!fromPop&&location.hash==='#watch')history.back()}
window.addEventListener('popstate',()=>{if($('#modal').classList.contains('open'))closeModal(true)});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#search').addEventListener('input',e=>{clearTimeout(searchTimer);if(currentRoute!=='search')go('search');searchTimer=setTimeout(()=>runSearch(e.target.value),420)});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const f=c.dataset.filter;if(f==='movies'||f==='series')go(f);else loadCatalog(f)});$('#heroPlay').onclick=()=>heroItem?openItem(heroItem):go('movies');
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#watch'))applyRoute()});if(!location.hash)history.replaceState({},'','#/home');applyRoute();
</script>
</body>
